# The CompUtils environment. conda-installer.py builds it and then pip-installs
# CompUtils from the chosen branch with --no-deps, so this list must cover
# pyproject.toml's dependencies.
name: compUtils
channels:
  - conda-forge
dependencies:
  - python=3.11
  - goodvibes=3.2
  - rich>=13.7
  - textual>=6.4
  - pandas
  - regex
  - xlsxwriter
  - git
  - pip
  - cclib
  - matplotlib
  - scikit-learn
  - pyside6
  - periodictable
