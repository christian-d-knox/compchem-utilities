# The CompUtils environment. conda-installer.py builds it (with only these
# channels: --override-channels) and then pip-installs CompUtils from its branch
# with --no-deps, so this list must cover pyproject.toml's dependencies. It reads
# flat lists only: no nested entries such as '- pip:'.
name: compUtils
channels:
  - conda-forge
  # Never Anaconda's own channels (or their Terms of Service): conda-forge only
  - nodefaults
dependencies:
  - python=3.11
  - goodvibes=3.2
  - rich>=13.7
  - textual>=6.4
  - pandas
  - regex
  - xlsxwriter
  - git
  - pip
  - cclib
  - matplotlib
  - scikit-learn
  - pyside6
  - periodictable
