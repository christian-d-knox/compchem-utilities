# example-profile.toml -- A CompUtils lab profile
#
# A lab profile holds what a lab shares but shouldn't publish: its own clusters (e.g. a private partition) and shared
# settings (e.g. the Telegram bot that alerts the group). Keep it somewhere only your lab can read, such as your
# group's shared folder on the cluster (chgrp <group> + chmod 640), and give labmates its path. CompUtils asks for
# it during first-time setup (the first `cu` run after installing); afterwards, apply or change it with:
#
#   cu -profile /path/to/lab-profile.toml
#
# CompUtils keeps a copy in ~/bin/profile.toml, and offers to apply this file again whenever it changes.
# Every value is checked like the config files; unknown keys are ignored with a warning.

# Shown when the profile is applied
name = "Example Lab"

# Any global config key (see the TOML files in ~/bin), applied to every labmate's config. Leave a key out
# (or commented out) rather than empty: an empty value is applied too, e.g. wiping a labmate's own bot token.
# benchmarkMethods (route cards) becomes the Single Point Methods of every labmate's global keylists.cusf
[settings]
isNotifications = true
# botToken = "123456789:ABC..."   # the lab bot's token, from Telegram's @BotFather
# broadcastGroupChatID = "-100..."   # the group chat that hears about large submissions
# An agent plugin your lab gives its agents, kept as a git clone of a private repository on each labmate's own computer:
# the daily report reminds their agent to update it there (cu --update-plugin). Leave these out for none.
# agentPluginFolder = "~/path/to/your-plugin"     # its folder on the labmate's computer
# agentPluginUpdater = "scripts/update.py"        # its own updater, relative to the folder; prints one JSON record
# agentPluginRepo = "https://github.com/your-lab/your-plugin.git"
# agentPluginBranch = "main"
# agentPluginProfile = "lab-profile.toml"         # this profile's path in the plugin, if the plugin carries it: a newer
#                                                 # one is relayed to each labmate's cluster account, asking first
benchmarkMethods = [
    "M062X 6-311+G(d,p)",
    "B3LYP 6-311+G(d,p) EmpiricalDispersion=GD3BJ",
]

# A cluster setup offers (listed before the built-in Bridges2 and Stampede3).
# submissionList is its SLURM header: each line is filled in by the flag it holds
# (-J name, -o output, --ntasks CPUs, --mem memory, -t wall time, -p partition, -M cluster).
# Any other key is a setting that choosing this cluster applies.
[clusters.ExampleHPC]
submissionList = [
    "#!/bin/bash -l",
    "#SBATCH -J",
    "#SBATCH -o",
    "#SBATCH -N 1",
    "#SBATCH --ntasks-per-node=",
    "#SBATCH --mem=",
    "#SBATCH -t",
    "#SBATCH -p",
]
partition = "example-lab"
CPU = 16
memoryRatio = 4.0

# A built-in cluster's table only overrides its settings (its header stays)
[clusters.Bridges2]
partition = "RM-shared"

# The lab's standard methods: whole keylists.cusf sections, written into each labmate's global file when the
# profile is applied (a project's own section still wins). Any of: "Optimization Methods", "Single Point Methods" (in
# place of benchmarkMethods above), "Mixed Basis", "ORCA Blocks", "Conformer Search Methods". {smd} / {alpb} write the project's solvent (project.toml:
# solvent = "THF"), nothing in the gas phase; {name} picks a named Mixed Basis set; [metal: ...] applies to molecules
# with a d- or f-block metal.
[keylists]
"Optimization Methods" = '''
# @opt
B3LYP EmpiricalDispersion=GD3BJ GenECP {light-sdd} opt freq [metal: freq=noraman]
'''
"Mixed Basis" = '''
# @light-sdd
H C N O 0
6-31G(d)
****
Pd 0
SDD
****

Pd 0
SDD
'''
