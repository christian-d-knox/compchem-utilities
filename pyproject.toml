[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name        = "compchem-utilities"
version     = "0.5.0"
description = "Your one-stop-shop for Computational Chemistry"
readme      = "README.md"
requires-python = ">=3.11"
authors     = [{name = "Christian Drew Knox"}]
license     = {text = "MIT"}
dependencies = [
    "rich>=13.7",
    "textual>=6.4",
    "termcolor",
    "pandas",
    "regex",
    "xlsxwriter",
    "goodvibes>=3.2,<4",   # 4.x renamed -t, its output file and its table rules
]

[project.scripts]
cu = "computils.__main__:Main"

[tool.setuptools.packages.find]
include = ["computils*"]