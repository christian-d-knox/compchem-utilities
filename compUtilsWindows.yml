# compUtils.yml for Windows. conda-installer.py picks it on Windows and builds it for you
# (python conda-installer.py), then writes the 'cu' command (cu.cmd on your user PATH).
# Keep it current with cu -env (or the TUI's Update Environment).
# If conda asks you to accept Anaconda's Terms of Service, it is checking the channels your conda is set up with
# (not this file's): remove them with 'conda config --remove channels defaults', or accept them if you use them.
# @platform windows
name: compUtilsWindows
channels:
  - conda-forge
  # Never Anaconda's own channels (or their Terms of Service): conda-forge only
  - nodefaults
dependencies:
  - python=3.11
  - goodvibes=3.2
  - rich>=13.7
  - textual>=6.4
  - pandas
  - regex
  - xlsxwriter
  # Excel workbooks with formulas, for agents' calculations; imported by nothing yet
  - openpyxl
  - git
  - pip
  - cclib
  - matplotlib
  - scikit-learn
  - pyside6
  - periodictable
  # For workflows to come: cheminformatics (SMILES, conformers) and semiempirical
  # xTB methods. CREST has no Windows build on conda-forge (Linux and macOS only)
  - rdkit
  - xtb
