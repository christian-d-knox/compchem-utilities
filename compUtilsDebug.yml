# compUtils.yml plus memray, for measuring resource use. Build it by hand:
#   conda env create -f compUtilsDebug.yml
#   conda activate compUtilsDebug
#   pip install -e .    (from a clone, or the git URL conda-installer.py uses)
name: compUtilsDebug
channels:
  - conda-forge
  # Never Anaconda's own channels (or their Terms of Service): conda-forge only
  - nodefaults
dependencies:
  - python=3.11
  - goodvibes=3.2
  - rich>=13.7
  - textual>=6.4
  - pandas
  - regex
  - xlsxwriter
  - git
  - pip
  - cclib
  - matplotlib
  - scikit-learn
  - pyside6
  - periodictable
  - memray
